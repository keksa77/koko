<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trenér U7</title>
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#1b2420; --muted:#5f6b65; --line:#dfe5e1;
  --brand:#1f7a3f; --brand-ink:#ffffff; --accent:#f2b705; --danger:#c0392b; --chip:#e8efe9;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111614; --card:#1a211e; --ink:#e7ece9; --muted:#9aa8a1; --line:#2b3531;
    --brand:#35a862; --brand-ink:#08130c; --chip:#243029; --shadow:none; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 16px calc(10px);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-size:14px}
nav.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:4}
nav.tabs button{flex:1;border:0;background:none;padding:12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand)}
.chip.on::before{content:"✓ "}
.chip.all.on::before{content:""}
.chips{flex-wrap:wrap;overflow:visible!important;padding-left:4px!important;row-gap:10px}
.selinfo{font-size:13px;margin:-4px 0 8px;color:var(--brand);font-weight:600}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;background:var(--chip);color:var(--ink);margin-right:4px}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--chip);cursor:pointer}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.sm{padding:6px 10px;font-size:13px;margin:6px 6px 0 0}
.animcap{font-weight:600;font-size:14px;min-height:20px;margin-top:6px}
.animbar{display:flex;flex-wrap:wrap}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#1b1b1b;font-size:30px;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:6}
.star{border:0;background:none;font-size:22px;line-height:1;padding:2px 4px;color:var(--muted)}
.star.on{color:var(--accent)}
.drill-title{font-weight:700;font-size:17px;margin:0}
.section h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 4px}
.section p{margin:0;white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;padding:32px 8px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
.plan-item{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.plan-item:first-child{border-top:0}
.plan-item input{width:64px;padding:6px 8px}
.num{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:32px;height:32px;flex:none}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:86vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card)}
dialog .dbody{padding:8px 16px 16px;overflow:auto}
.pick{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.center{max-width:380px;margin:40px auto}
.back{border:0;background:none;color:var(--brand);font-weight:600;padding:0 0 10px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:14px}
.sumgrid span{margin-right:6px}
.tl{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl-time{flex:none;width:58px;display:flex;flex-direction:column;align-items:flex-start;border-right:3px solid var(--brand);padding-right:6px}
.tl-time b{font-size:15px;color:var(--brand)}
.tl-time span{font-size:12px;color:var(--muted)}
.tl-body{flex:1;min-width:0}
.tl-meta{font-size:13px;color:var(--muted);margin-top:2px}
.tl-meta .warn{color:#b35c00;font-weight:600}
.tl-note{font-size:14px;background:var(--chip);border-radius:8px;padding:4px 8px;margin-top:6px;white-space:pre-wrap}
.tl-desc{margin:6px 0 0;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-desc.open{display:block;-webkit-line-clamp:unset}
.tl-more{margin-top:4px;font-size:14px}
.tl-more summary{color:var(--brand);font-weight:600;cursor:pointer;font-size:12px}
.tl-more p{margin:4px 0;white-space:pre-wrap}
.tl-end{padding:8px 0}
.vid{flex:none;background:#c4302b;color:#fff;text-decoration:none;font-size:13px;font-weight:700;border-radius:8px;padding:5px 9px;white-space:nowrap}
.print-only{display:none}
@media print{.print-only{display:block;font-size:11px;color:#555;word-break:break-all} .tl-desc{display:block;-webkit-line-clamp:unset} .tl-more summary{display:none}}
.agebar{font-size:14px;margin:-4px 0 10px;color:var(--muted)}
.agebar b{color:var(--brand)}
.linkbtn{border:0;background:none;color:var(--brand);text-decoration:underline;padding:0 4px;font-size:14px}
.agepick{display:flex;flex-wrap:wrap;gap:6px}
.agepick .chip{font-size:16px;padding:8px 16px}
label.chk{display:inline-flex;gap:4px;align-items:center;font-weight:500;margin:0 10px 0 0}
.plan{min-height:60px}
.pi,.po{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);background:var(--card)}
.pi:first-child,.po:first-child{border-top:0}
.handle{flex:none;touch-action:none;cursor:grab;font-size:22px;line-height:1;color:var(--muted);padding:6px 4px;user-select:none}
.pt{flex:none;width:44px;font-weight:700;color:var(--brand);font-size:14px}
.pn{font-weight:600;font-size:15px;line-height:1.25}
.pw{font-size:12px;color:#b35c00;font-weight:600}
.pnote{margin-top:4px;width:100%;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;background:var(--card)}
.dur{flex:none;display:flex;align-items:center;gap:2px}
.dur button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--chip);font-size:18px;line-height:1}
.dur b{min-width:22px;text-align:center}
.dur small{color:var(--muted);margin-right:2px}
.x{flex:none;border:0;background:none;color:var(--muted);font-size:16px;padding:4px}
.add{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:22px;line-height:1}
.dropempty{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.ph{height:46px;border:2px dashed var(--brand);border-radius:10px;margin:4px 0;background:rgba(31,122,63,.06)}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:10px;padding:6px 8px;background:var(--card)}
.dragging{opacity:.3}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;margin:0 -16px -96px;font-size:14px;font-weight:600;z-index:5}
input[type=time]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.sdate{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--chip);padding:6px 0;line-height:1.1}
.sdate b{display:block;font-size:20px;color:var(--brand)}
.sdate span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.past{opacity:.6}
@media print{header,nav.tabs,.fab,.noprint{display:none!important} body{background:#fff;color:#000} .card{box-shadow:none;border-color:#bbb;break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1 id="title">⚽ Trenér</h1>
  <button id="logoutBtn" hidden>Odhlásit</button>
</header>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="drills" class="on">Cvičení</button>
  <button data-tab="sessions">Tréninky</button>
  <button data-tab="settings" style="flex:0 0 auto;padding:12px 16px" aria-label="Nastavení">⚙</button>
</nav>
<main id="app"><p class="muted">Načítám…</p></main>
<button class="fab" id="fab" hidden aria-label="Přidat">+</button>
<dialog id="pickDlg"><div class="dhead"><strong class="grow">Přidat cvičení do tréninku</strong><button class="btn small" id="pickClose">Hotovo</button></div><div class="dbody"><input type="search" id="pickSearch" placeholder="Hledat…"><div id="pickList"></div></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>/*ANIM*/
/* ===== Animace cvičení: jednoduchý SVG engine + scény ===== */
const Anim = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const COL = { blue: "#2563eb", red: "#dc2626", ice: "#38bdf8", yellow: "#eab308", coach: "#111827", sick: "#65a30d", orange: "#f97316" };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const lerp = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
  const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

  function stage(svg, vb) {
    const [W, H] = vb;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = "";
    const el = (tag, attrs = {}, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
    const L = { field: el("g"), stuff: el("g"), players: el("g"), balls: el("g"), labels: el("g"), hud: el("g") };
    for (let i = 0; i < Math.ceil(H / 30); i++) el("rect", { x: 0, y: i * 30, width: W, height: 15, fill: "#43a55b" }, L.field);

    const S = { W, H, el, L, COL, lerp, ease, ramp, clamp, time: 0 };

    S.label = (text, x, y, color = "#1b2420", parent = L.labels) => {
      const g = el("g", {}, parent);
      const r = el("rect", { height: 12, rx: 6, fill: "#fff", "fill-opacity": .93 }, g);
      const t = el("text", { "text-anchor": "middle", "font-size": 7.5, "font-weight": 700, fill: color, "dominant-baseline": "central" }, g);
      g.set = (tx, px, py) => {
        if (tx != null && t.textContent !== tx) { t.textContent = tx; g._w = t.getComputedTextLength() + 9; }
        const w = g._w || 20, cx = clamp(px, w / 2 + 2, W - w / 2 - 2), cy = clamp(py, 8, H - 8);
        t.setAttribute("x", cx); t.setAttribute("y", cy); r.setAttribute("x", cx - w / 2); r.setAttribute("y", cy - 6); r.setAttribute("width", w);
      };
      g.show = v => g.setAttribute("visibility", v ? "visible" : "hidden");
      g.set(text, x, y); return g;
    };
    S.area = (x, y, w, h, opt = {}) => el("rect", { x, y, width: w, height: h, rx: opt.rx ?? 3, fill: opt.fill || "none", "fill-opacity": opt.fo ?? 1, stroke: opt.stroke || "#fff", "stroke-width": opt.sw ?? 1.5, "stroke-dasharray": opt.dash ?? "5 4" }, L.field);
    S.cone = (x, y, c = "#f97316") => { const g = el("g", { transform: `translate(${x},${y})` }, L.stuff); el("path", { d: "M-3 2.5 L0 -4 L3 2.5 Z", fill: c, stroke: "#7c2d12", "stroke-width": .4 }, g); return g; };
    S.goal = (x, y, ang = 0, w = 26) => { // ang: kam míří ústí branky (stupně), 0 = doprava
      const g = el("g", { transform: `translate(${x},${y}) rotate(${ang})` }, L.stuff);
      el("rect", { x: -9, y: -w / 2, width: 9, height: w, fill: "#fff", "fill-opacity": .35 }, g);
      for (let i = 1; i < 5; i++) el("line", { x1: -9, y1: -w / 2 + i * w / 5, x2: 0, y2: -w / 2 + i * w / 5, stroke: "#fff", "stroke-width": .5 }, g);
      el("path", { d: `M0 ${-w / 2} L-9 ${-w / 2} L-9 ${w / 2} L0 ${w / 2}`, fill: "none", stroke: "#fff", "stroke-width": 2.4, "stroke-linejoin": "round" }, g);
      el("path", { d: "M3 0 l5 -3 v6 z", fill: "#fde047" }, g);
      return g;
    };
    S.ladder = (x, y, len, rungs = 7) => { const g = el("g", {}, L.stuff); el("rect", { x, y: y - 5, width: len, height: 10, fill: "none", stroke: "#facc15", "stroke-width": 1.2 }, g); for (let i = 1; i < rungs; i++) el("line", { x1: x + i * len / rungs, y1: y - 5, x2: x + i * len / rungs, y2: y + 5, stroke: "#facc15", "stroke-width": 1.2 }, g); return g; };
    S.hurdle = (x, y) => { const g = el("g", { transform: `translate(${x},${y})` }, L.stuff); el("path", { d: "M-5 4 L-5 -2 L5 -2 L5 4", fill: "none", stroke: "#f43f5e", "stroke-width": 1.6 }, g); return g; };
    S.mat = (x, y, w, h, c = "#60a5fa") => el("rect", { x, y, width: w, height: h, rx: 2, fill: c, "fill-opacity": .75, stroke: "#1e3a8a", "stroke-width": .8 }, L.field);

    S.kid = (color, opt = {}) => {
      const g = el("g", {}, L.players), body = el("g", {}, g);
      el("ellipse", { cx: 0, cy: 12, rx: 6, ry: 1.8, fill: "#000", "fill-opacity": .18 }, body);
      const legL = el("line", { x1: -1.6, y1: 5, x2: -2, y2: 11.5, stroke: "#2b2b2b", "stroke-width": 2.2, "stroke-linecap": "round" }, body);
      const legR = el("line", { x1: 1.6, y1: 5, x2: 2, y2: 11.5, stroke: "#2b2b2b", "stroke-width": 2.2, "stroke-linecap": "round" }, body);
      el("rect", { x: -3.6, y: 3, width: 7.2, height: 3.4, rx: 1, fill: "#1f2937" }, body);
      const armL = el("line", { x1: -3.8, y1: -2, x2: -6, y2: 3, stroke: "#f1c9a5", "stroke-width": 1.8, "stroke-linecap": "round" }, body);
      const armR = el("line", { x1: 3.8, y1: -2, x2: 6, y2: 3, stroke: "#f1c9a5", "stroke-width": 1.8, "stroke-linecap": "round" }, body);
      const shirt = el("rect", { x: -4.2, y: -4, width: 8.4, height: 8, rx: 2.4, fill: color }, body);
      const head = el("circle", { cx: 0, cy: -7.8, r: 3.6, fill: "#f1c9a5" }, body);
      el("path", { d: "M-3.6 -8.5 Q0 -13 3.6 -8.5 Q0 -10.5 -3.6 -8.5 Z", fill: opt.hair || "#5b3a1e" }, body);
      const crown = el("path", { d: "M-4 -11 L-4 -15 L-2 -13 L0 -16 L2 -13 L4 -15 L4 -11 Z", fill: "#e0f2fe", stroke: "#0284c7", "stroke-width": .5, visibility: opt.crown ? "visible" : "hidden" }, body);
      const cap = el("path", { d: "M-4 -9 Q0 -14 4 -9 L7 -9 L4 -8 Z", fill: "#111827", visibility: opt.cap ? "visible" : "hidden" }, body);
      const ice = el("rect", { x: -7, y: -13, width: 14, height: 26, rx: 4, fill: "#bae6fd", "fill-opacity": .55, stroke: "#7dd3fc", "stroke-width": .8, visibility: "hidden" }, g);
      const carry = el("path", { d: "M-3 2 Q0 -3.5 3 2 Z", fill: "#f2b705", stroke: "#b88700", "stroke-width": .5, visibility: "hidden", transform: "translate(6,-4)" }, body);
      const tag = S.label("", 0, 0, color, L.labels); tag.show(false);
      const k = { g, color, x: 0, y: 0, idx: S._kids = (S._kids || 0) + 1 };
      k.set = (x, y, st = {}) => {
        const dx = x - (k.x ?? x), dy = y - (k.y ?? y), moving = st.moving ?? (Math.hypot(dx, dy) > .05);
        k.dir = Math.abs(dx) > .03 ? Math.sign(dx) : (k.dir || 1); k.x = x; k.y = y; k.moving = moving;
        if (st.color && st.color !== k._c) { shirt.setAttribute("fill", st.color); k._c = st.color; }
        const sw = moving ? Math.sin(S.time * 14 + k.idx) : 0;
        const up = st.frozen ? 1 : 0;
        legL.setAttribute("x2", -2 + sw * 2.6 - up * 1.5); legR.setAttribute("x2", 2 - sw * 2.6 + up * 1.5);
        armL.setAttribute("x2", -6 - sw * 1.6 - up); armL.setAttribute("y2", up ? -7 : 3);
        armR.setAttribute("x2", 6 + sw * 1.6 + up); armR.setAttribute("y2", up ? -7 : 3);
        const hop = st.hop ? -3.5 * Math.abs(Math.sin(S.time * 9)) : 0;
        body.setAttribute("transform", st.down ? `translate(0,8) rotate(-90) scale(.95,1)` : `translate(0,${hop}) scale(${k.dir},1)`);
        head.setAttribute("fill", st.sick ? "#bef264" : "#f1c9a5");
        g.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`);
        g.setAttribute("opacity", st.alpha ?? 1);
        ice.setAttribute("visibility", st.frozen ? "visible" : "hidden");
        crown.setAttribute("visibility", (st.crown ?? opt.crown) ? "visible" : "hidden");
        carry.setAttribute("visibility", st.carry ? "visible" : "hidden");
        if (st.tag) { tag.set(st.tag, x, st.tagBelow ? y + 22 : y - 22); tag.show(true); } else tag.show(false);
      };
      return k;
    };
    S.ball = () => {
      const b = el("g", {}, L.balls);
      el("circle", { r: 2.6, fill: "#fff", stroke: "#333", "stroke-width": .6 }, b);
      el("path", { d: "M-1 -1 L1 -1 L1.4 .8 L0 1.8 L-1.4 .8 Z", fill: "#333" }, b);
      b.set = (x, y, vis = true) => { b.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`); b.setAttribute("visibility", vis ? "visible" : "hidden"); };
      return b;
    };
    S.foot = k => [k.x + (k.dir || 1) * 6, k.y + 11];
    // Pohyb po klíčových bodech: [[t,x,y,{flags}],...]; vrací {x,y,...flags platné v úseku}
    S.track = keys => t => {
      if (t <= keys[0][0]) return { x: keys[0][1], y: keys[0][2], ...(keys[0][3] || {}) };
      for (let i = 1; i < keys.length; i++) {
        const a = keys[i - 1], b = keys[i];
        if (t <= b[0]) { const u = ease((t - a[0]) / (b[0] - a[0] || 1)); return { x: a[1] + (b[1] - a[1]) * u, y: a[2] + (b[2] - a[2]) * u, ...(a[3] || {}) }; }
      }
      const z = keys[keys.length - 1]; return { x: z[1], y: z[2], ...(z[3] || {}) };
    };
    // Periodické "bloudění" hráče po prostoru (perioda T, aby smyčka navazovala)
    S.wander = (i, box, T) => t => {
      const w = 2 * Math.PI / T, [x0, y0, x1, y1] = box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, ax = (x1 - x0) / 2, ay = (y1 - y0) / 2;

    return { stop() { dead = true; cancelAnimationFrame(raf); }, seek(x) { t = x; S.time = x; sc.update(x); cap.textContent = sc.caption?.(x) || ""; }, T: sc.T };
  }
  return { mount, has: n => !!SCENES[n], names: () => Object.keys(SCENES) };
})();

function showSession(id){

    const url = safeUrl(d.video_url);
    const pl = players(d);
    const kidsWarn = kids && ((d.players_min && kids < d.players_min) || (d.players_max && kids > d.players_max));
    const coachWarn = s.coaches && d.coaches_needed && d.coaches_needed > s.coaches;
    const more = [
      d.setup && `<p><b>Příprava:</b> ${esc(d.setup)}</p>`,
      d.equipment && `<p><b>Pomůcky:</b> ${esc(d.equipment)}</p>`,
      d.area && `<p><b>Prostor:</b> ${esc(d.area)}</p>`,
      d.coaching_points && `<p><b>Na co dbát:</b> ${esc(d.coaching_points)}</p>`,
      d.variations && `<p><b>Varianty:</b> ${esc(d.variations)}</p>`
    ].filter(Boolean).join("");
    return `<div class="tl">
      <div class="tl-time"><b>${clock}</b><span>${dur} min</span></div>
      <div class="tl-body">
        <div class="row" style="align-items:flex-start"><p class="drill-title grow" style="font-size:16px">${i+1}. ${esc(d.name)}</p>
          ${url?`<a class="vid noprint" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Video">▶ Video</a>`:""}</div>
        <div class="tl-meta">${CATS[d.category]}${pl?` · <span${kidsWarn?' class="warn"':""}>👥 ${esc(pl)}</span>`:""}${d.coaches_needed?` · <span${coachWarn?' class="warn"':""}>🧑‍🏫 ${d.coaches_needed}</span>`:""}</div>
        ${it.note?`<div class="tl-note">📌 ${esc(it.note)}</div>`:""}
        ${d.description?`<p class="tl-desc">${esc(d.description)}</p>`:""}
        ${more?`<details class="tl-more"><summary>Více (příprava, pomůcky, na co dbát)</summary>${more}</details>`:""}
        ${url?`<div class="print-only tl-url">Video: ${esc(url)}</div>`:""}
      </div></div>`; }).join("");
  const end = start!=null ? hhmm(start+t) : null;
  app.innerHTML = `<button class="back noprint" id="back">‹ Zpět</button>
  <div class="card" style="padding:12px 14px">
    <h2 style="margin:0;font-size:20px">${esc(s.title)}</h2>
    <div class="sumgrid">
      <div style="grid-column:1/-1;font-size:17px;font-weight:700;color:var(--brand)"><span>📅</span>${new Date(s.date+"T00:00").toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
      <div style="white-space:nowrap"><span>⏱</span>${start!=null?`${hhmm(start)}–${end} · `:""}<b>${t} min</b></div>
      <div><span>👥</span>${kids?`${kids} dětí`:"děti neuvedeny"}</div>
      <div><span>🧑‍🏫</span>${s.coaches?`${s.coaches} trenér${s.coaches>1?"i":""}`:"trenéři neuvedeni"}</div>
    </div>
    ${s.note?`<p class="tl-note" style="margin:8px 0 0">${esc(s.note)}</p>`:""}
  </div>
  <div class="card" style="padding:4px 12px">${rows || `<p class="muted">Trénink zatím nemá žádná cvičení.</p>`}
    ${end?`<div class="tl tl-end"><div class="tl-time"><b>${end}</b></div><div class="tl-body muted" style="padding-top:2px">Konec tréninku</div></div>`:""}
  </div>
  <div class="row noprint" style="flex-wrap:wrap;gap:6px"><button class="btn primary small" id="edit">Upravit</button><button class="btn small" id="expand">Rozbalit vše</button><button class="btn small" id="print">Tisk / PDF</button><button class="btn small" id="dup">Duplikovat</button><span class="grow"></span><button class="btn danger small" id="del">Smazat</button></div>`;
  app.querySelectorAll(".tl-desc").forEach(p => p.onclick = () => p.classList.toggle("open"));
  document.getElementById("back").onclick = () => { state.view=null; render(); };
  document.getElementById("edit").onclick = () => editSession(s);
  const ex = document.getElementById("expand");
  ex.onclick = () => { const all = app.querySelectorAll("details.tl-more"); const open = ![...all].every(d=>d.open); all.forEach(d=>d.open=open); ex.textContent = open ? "Sbalit vše" : "Rozbalit vše"; };
  document.getElementById("print").onclick = () => { app.querySelectorAll("details.tl-more").forEach(d=>d.open=true); print(); };
  document.getElementById("dup").onclick = () => editSession({ ...s, id:null, date:new Date().toISOString().slice(0,10), title:s.title+" (kopie)" });
  document.getElementById("del").onclick = async () => {
    if(!confirm(`Smazat trénink „${s.title}“? Cvičení v zásobníku zůstanou.`)) return;
    const { error } = await sb.from("sessions").delete().eq("id", s.id); if(error) return fail(error);
    await loadSessions(); state.view=null; toast("Smazáno"); render();
  };
  scrollTo(0,0);
}
function editSession(s={}){
  state.view = { type:"editSession" }; fab.hidden = true;
  const items = [...(s.session_drills||[])].sort((a,b)=>a.position-b.position).map(x=>({ drill_id:x.drill_id, duration_min:x.duration_min||10, note:x.note||"" }));
  const today = new Date().toISOString().slice(0,10);
  const pickCats = new Set(state.cats); let pickQ = "";
  app.innerHTML = `<button class="back" id="back">‹ Zpět</button>
  <form id="sf" autocomplete="off">
    <div class="card">
      <h2 style="margin:0 0 6px">${s.id?"Upravit trénink":"Nový trénink"}</h2>
      <div class="grid2">
        <div style="grid-column:1/-1"><label>Název *</label><input type="text" name="title" required placeholder="např. Úterní trénink" value="${esc(s.title||"")}"></div>
        <div><label>📅 Datum konání *</label><input type="date" name="date" required value="${esc(s.date||today)}"></div>
        <div><label>🕔 Začátek</label><input type="time" name="start_time" value="${esc((s.start_time||"").slice(0,5))}"></div>
        <div><label>🧑‍🏫 Trenérů</label><input type="number" name="coaches" min="1" max="10" value="${esc(s.coaches??"")}"></div>
        <div><label>👥 Dětí</label><input type="number" name="players_expected" min="1" max="60" value="${esc(s.players_expected??"")}"></div>
      </div>
      <details style="margin-top:8px"><summary class="muted">Poznámka k tréninku</summary><textarea name="note" placeholder="Téma, docházka, co se povedlo…">${esc(s.note||"")}</textarea></details>
    </div>
    <div class="card">
      <div class="row"><strong class="grow">Rozvrh tréninku</strong><span class="muted" id="tot"></span></div>
      <p class="muted" style="margin:2px 0 8px">Přetáhni cvičení za úchyt ⠿ ze zásobníku sem, nebo klepni na +. Pořadí měníš přetažením, délku tlačítky − / +.</p>
      <div id="plan" class="plan"></div>
    </div>
    <div class="card">
      <div class="row"><strong class="grow">Zásobník cvičení</strong><span class="muted">${myAges().length && !state.showAllAges ? "kategorie "+esc(myAges().join(", ")) : "všechny kategorie"}</span></div>
      <input type="search" id="pq" placeholder="Hledat cvičení…" style="margin-top:8px">
      <div class="chips" id="pchips" style="margin-top:8px"></div>
      <div id="pool"></div>
    </div>
    <div class="savebar"><span id="tot2" class="grow"></span><button class="btn primary" type="submit">Uložit trénink</button></div>
  </form>`;
  const form = document.getElementById("sf"), plan = document.getElementById("plan"), pool = document.getElementById("pool");
  const findD = id => state.drills.find(x=>x.id===id);

  function totals(){
    const sum = items.reduce((a,x)=>a+(Number(x.duration_min)||0),0);
    const st = toMin(form.start_time.value);
    const txt = `${items.length} cvičení · ${sum} min${st!=null?` · ${hhmm(st)}–${hhmm(st+sum)}`:""}`;
    document.getElementById("tot").textContent = txt;
    document.getElementById("tot2").textContent = txt;
    let acc = 0;
    plan.querySelectorAll(".pi").forEach((row,i) => { const a=acc; acc += Number(items[i].duration_min)||0; row.querySelector(".pt").textContent = st!=null ? hhmm(st+a) : `${a}'`; });
    const c = Number(form.coaches.value)||0, kids = Number(form.players_expected.value)||0;
    plan.querySelectorAll(".pi").forEach((row,i) => {
      const d = findD(items[i].drill_id); const w = [];
      if(c && d?.coaches_needed > c) w.push(`potřeba ${d.coaches_needed} trenérů`);
      if(kids && ((d?.players_min && kids < d.players_min) || (d?.players_max && kids > d.players_max))) w.push(`pro ${d.players_min||"?"}–${d.players_max||"?"} dětí`);
      row.querySelector(".pw").textContent = w.length ? "⚠ " + w.join(", ") : "";
    });
  }
  function drawPlan(){
    plan.innerHTML = items.length ? items.map((it,i)=>{ const d=findD(it.drill_id);
      return `<div class="pi" data-i="${i}">
        <span class="handle" data-h="plan" aria-label="Přesunout">⠿</span>
        <span class="pt"></span>
        <div class="grow" style="min-width:0">
          <div class="pn">${esc(d?.name||"?")}</div>
          <div class="muted" style="font-size:12px">${CATS[d?.category]||""}${d?.xps_video||d?.video_url?" · ▶":""}</div>
          <div class="pw"></div>
          <input class="pnote" data-note="${i}" placeholder="poznámka (kdo vede, stanoviště…)" value="${esc(it.note)}">
        </div>
        <div class="dur"><button type="button" data-dm="${i}">−</button><b>${it.duration_min}</b><small>min</small><button type="button" data-dp="${i}">+</button></div>
        <button type="button" class="x" data-rm="${i}" aria-label="Odebrat">✕</button>
      </div>`; }).join("")
      : `<div class="dropempty">Sem přetáhni cvičení ze zásobníku</div>`;
    plan.querySelectorAll("[data-dm]").forEach(b => b.onclick = () => { const it=items[b.dataset.dm]; it.duration_min=Math.max(1,(it.duration_min||0)-1); drawPlan(); });
    plan.querySelectorAll("[data-dp]").forEach(b => b.onclick = () => { const it=items[b.dataset.dp]; it.duration_min=Math.min(90,(it.duration_min||0)+1); drawPlan(); });
    plan.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { items.splice(+b.dataset.rm,1); drawPlan(); drawPool(); });
    plan.querySelectorAll("[data-note]").forEach(inp => inp.oninput = () => { items[inp.dataset.note].note = inp.value; });
    plan.querySelectorAll('[data-h="plan"]').forEach(h => h.onpointerdown = e => startDrag(e, { type:"plan", index:+h.closest(".pi").dataset.i }, h.closest(".pi")));
    totals();
  }
  function poolList(){
    const q = pickQ.toLowerCase();
    return state.drills.filter(d => ageOk(d) && (!pickCats.size||pickCats.has(d.category)) && (!q || d.name.toLowerCase().includes(q)));
  }
  function drawPool(){
    const base = state.drills.filter(ageOk);
    const cats = Object.keys(CATS).filter(k => base.some(d=>d.category===k));
    document.getElementById("pchips").innerHTML = `<button type="button" class="chip all ${!pickCats.size?"on":""}" data-pc="all">Všechny typy</button>` +
      cats.map(k=>`<button type="button" class="chip ${pickCats.has(k)?"on":""}" aria-pressed="${pickCats.has(k)}" data-pc="${k}">${CATS[k]} (${base.filter(d=>d.category===k).length})</button>`).join("");
    document.querySelectorAll("[data-pc]").forEach(b => b.onclick = () => { toggleSet(pickCats, b.dataset.pc); drawPool(); });
    const used = new Set(items.map(x=>x.drill_id));
    const list = poolList();
    pool.innerHTML = list.map(d=>`<div class="po" data-id="${d.id}">
        <span class="handle" data-h="pool" aria-label="Přetáhnout do tréninku">⠿</span>
        <div class="grow" style="min-width:0"><div class="pn">${esc(d.name)}${used.has(d.id)?' <span class="muted">✓</span>':""}</div>
          <div class="muted" style="font-size:12px">${CATS[d.category]} · ${d.duration_min||10} min${d.coaches_needed>1?` · 🧑‍🏫 ${d.coaches_needed}`:""}${d.xps_video||d.video_url?" · ▶":""}</div></div>
        <button type="button" class="add" data-add="${d.id}" aria-label="Přidat na konec">+</button>
      </div>`).join("") || `<p class="muted">Nic nenalezeno.</p>`;
    pool.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { addDrill(b.dataset.add, items.length); });
    pool.querySelectorAll('[data-h="pool"]').forEach(h => h.onpointerdown = e => startDrag(e, { type:"pool", id:h.closest(".po").dataset.id }, h.closest(".po")));
  }
  function addDrill(id, at){ const d=findD(id); items.splice(at,0,{ drill_id:id, duration_min:d?.duration_min||10, note:"" }); drawPlan(); drawPool(); toast("Přidáno: "+(d?.name||"")); }

  // ---- drag & drop (myš i dotyk) ----
  let drag = null;
  function startDrag(e, payload, srcEl){
    e.preventDefault();
    const r = srcEl.getBoundingClientRect();
    const ghost = srcEl.cloneNode(true);
    ghost.classList.add("ghost"); ghost.style.width = r.width+"px"; ghost.style.left = r.left+"px"; ghost.style.top = r.top+"px";
    document.body.appendChild(ghost);
    const ph = document.createElement("div"); ph.className = "ph";
    if(payload.type==="plan") srcEl.classList.add("dragging");
    drag = { payload, ghost, ph, srcEl, dx:e.clientX-r.left, dy:e.clientY-r.top, index:null };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp, { once:true });
    document.addEventListener("pointercancel", onUp, { once:true });
    onMove(e);
  }
  function onMove(e){
    if(!drag) return;
    drag.ghost.style.left = (e.clientX-drag.dx)+"px"; drag.ghost.style.top = (e.clientY-drag.dy)+"px";
    // automatické posouvání stránky u okrajů
    if(e.clientY < 70) scrollBy(0,-12); else if(e.clientY > innerHeight-90) scrollBy(0,12);
    const pr = plan.getBoundingClientRect();
    const inside = e.clientY > pr.top-40 && e.clientY < pr.bottom+40 && e.clientX > pr.left-20 && e.clientX < pr.right+20;
    if(!inside){ drag.ph.remove(); drag.index = null; return; }
    const rows = [...plan.querySelectorAll(".pi")].filter(x=>x!==drag.srcEl);
    let idx = rows.length;
    for(let i=0;i<rows.length;i++){ const rr=rows[i].getBoundingClientRect(); if(e.clientY < rr.top+rr.height/2){ idx=i; break; } }
    drag.index = idx;
    const empty = plan.querySelector(".dropempty"); if(empty) empty.remove();
    if(idx < rows.length) plan.insertBefore(drag.ph, rows[idx]); else plan.appendChild(drag.ph);
  }
  function onUp(){
    document.removeEventListener("pointermove", onMove);
    if(!drag) return;
    const { payload, index } = drag;
    drag.ghost.remove(); drag.ph.remove(); drag.srcEl.classList.remove("dragging");
    drag = null;
    if(index==null){ drawPlan(); return; }
    if(payload.type==="plan"){ const [it] = items.splice(payload.index,1); items.splice(index,0,it); drawPlan(); }
    else addDrill(payload.id, index);
  }

  document.getElementById("pq").oninput = e => { pickQ = e.target.value; drawPool(); };
  form.start_time.oninput = totals; form.coaches.oninput = totals; form.players_expected.oninput = totals;
  drawPlan(); drawPool();
  document.getElementById("back").onclick = () => s.id ? showSession(s.id) : (state.view=null, render());
  form.onsubmit = async e => {
    e.preventDefault();
    if(!items.length && !confirm("Trénink zatím nemá žádné cvičení. Uložit i tak?")) return;
    const fd = Object.fromEntries(new FormData(form));
    for(const k of ["coaches","players_expected"]) fd[k] = fd[k] ? Number(fd[k]) : null;
    for(const k in fd) if(fd[k]==="") fd[k]=null;
    const btn = e.submitter; btn.disabled = true;
    try{
      let id = s.id;
      if(id){ const { error } = await sb.from("sessions").update(fd).eq("id", id); if(error) throw error;
        const { error: e2 } = await sb.from("session_drills").delete().eq("session_id", id); if(e2) throw e2; }
      else { const { data, error } = await sb.from("sessions").insert(fd).select().single(); if(error) throw error; id = data.id; }
      if(items.length){ const { error } = await sb.from("session_drills").insert(items.map((x,i)=>({ session_id:id, drill_id:x.drill_id, duration_min:x.duration_min||null, note:x.note||null, position:i }))); if(error) throw error; }
      await loadSessions(); toast("Trénink uložen"); showSession(id);
    }catch(err){ fail(err); btn.disabled = false; }
  };
  scrollTo(0,0);
}

/* ---------- SETTINGS ---------- */
async function loadProfile(){
  const { data, error } = await sb.from("profiles").select("*").eq("user_id", state.user.id).maybeSingle();
  if(error) throw error; state.profile = data || null;
}
function renderSettings(first=false){
  fab.hidden = true;
  const cur = new Set(myAges());
  app.innerHTML = `<div class="card">
    <h2 style="margin-top:0">${first?"Vítej! Pro jaké kategorie trénuješ?":"Nastavení"}</h2>
    <p class="muted" style="margin-top:0">Vyber jednu nebo více kategorií. Zásobník cvičení i výběr při skládání tréninku se podle nich automaticky vyfiltruje.</p>
    <label>Moje kategorie</label>
    <div class="agepick">${AGES.map(a=>`<button type="button" class="chip ${cur.has(a)?"on":""}" aria-pressed="${cur.has(a)}" data-age="${a}">${a}</button>`).join("")}</div>
    <div class="selinfo" style="margin-top:8px">${cur.size ? "Vybráno: " + ageSort([...cur]).join(", ") : '<span class="muted">Zatím nic nevybráno.</span>'}</div>
    <div class="muted">${ageSort([...cur]).map(a=>`${a} – ${AGE_INFO[a]}`).join("<br>")}</div>
    ${first?`<button class="btn primary" id="goOn" style="margin-top:14px;width:100%" ${cur.size?"":"disabled"}>Pokračovat</button>`:""}
    <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:14px"><input type="checkbox" id="allAges" ${state.showAllAges?"checked":""}> Zobrazovat i cvičení pro jiné kategorie</label>
    ${first?"":`<div style="border-top:1px solid var(--line);margin-top:18px;padding-top:12px" class="muted">Přihlášen: ${esc(state.user.email)}</div>`}
  </div>`;
  app.querySelectorAll("[data-age]").forEach(b => b.onclick = async () => {
    const set = new Set(myAges()); toggleSet(set, b.dataset.age);
    const age_groups = ageSort([...set]);
    const { error } = await sb.from("profiles").upsert({ user_id: state.user.id, age_groups, age_group: age_groups[0] || null, updated_at: new Date().toISOString() });
    if(error) return fail(error);
    state.profile = { ...(state.profile||{}), age_groups, age_group: age_groups[0] || null };
    setTitle(); renderSettings(first);
  });
  const go = document.getElementById("goOn"); if(go) go.onclick = () => { state.tab = "drills"; render(); };
  document.getElementById("allAges").onchange = e => { state.showAllAges = e.target.checked; try{ localStorage.setItem("allAges", e.target.checked?"1":""); }catch(_){} };
}
function setTitle(){ const m = myAges(); document.getElementById("title").textContent = "⚽ Trenér" + (m.length ? " " + (m.length>2 ? ageRange(m) : m.join("+")) : ""); }

/* ---------- SHELL ---------- */
function render(){
  if(!state.user) return renderAuth();
  document.getElementById("tabs").hidden = false; document.getElementById("logoutBtn").hidden = false;
  setTitle();
  if(!myAges().length){ document.getElementById("tabs").hidden = true; return renderSettings(true); }
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab===state.tab));
  if(state.view?.type==="drill") return showDrill(state.view.id);
  if(state.view?.type==="session") return showSession(state.view.id);
  if(state.tab==="settings") return renderSettings();
  fab.hidden = false;
  state.tab==="drills" ? renderDrills() : renderSessions();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.view = null; render(); });
fab.onclick = () => state.tab==="drills" ? editDrill() : editSession();
document.getElementById("logoutBtn").onclick = () => sb.auth.signOut();
try{ state.showAllAges = !!localStorage.getItem("allAges"); }catch(_){}

let loadedFor = null;
sb.auth.onAuthStateChange((_ev, session) => {
  const u = session?.user || null;
  state.user = u;
  if(!u){ loadedFor = null; state.drills=[]; state.sessions=[]; state.profile=null; state.view=null; return render(); }
  if(loadedFor === u.id) return;
  loadedFor = u.id;
  setTimeout(async () => {
    try{ await Promise.all([loadDrills(), loadSessions(), loadProfile()]); }catch(e){ fail(e); }
    render();
  }, 0);
});
</script>
</body>
</html>
