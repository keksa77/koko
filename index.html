<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KoKo – kouč kopané</title>
<meta name="application-name" content="KoKo">
<meta name="apple-mobile-web-app-title" content="KoKo">
<meta name="description" content="KoKo – kouč kopané: databáze cvičení a plánovač tréninků pro fotbalové přípravky">
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#1b2420; --muted:#48534d; --line:#dfe5e1;
  --brand:#1f7a3f; --brand-ink:#ffffff; --accent:#f2b705; --danger:#c0392b; --chip:#e8efe9;
  --shadow:0 1px 3px rgba(0,0,0,.08); --sel:#e3f2e7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111614; --card:#1a211e; --ink:#e7ece9; --muted:#b3c0b9; --line:#2b3531;
    --brand:#35a862; --brand-ink:#08130c; --chip:#243029; --shadow:none; --sel:#1d3526; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 16px calc(10px);display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:baseline;gap:10px;min-width:0}
header h1 .brand{font-size:24px;font-weight:800;letter-spacing:.02em}
header h1 .sub{font-size:15px;font-weight:500;opacity:.9;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-size:16px}
nav.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:4}
nav.tabs button{flex:1;border:0;background:none;padding:12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button.tab2{line-height:1.1;padding:6px 8px;font-size:.92em}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px;font-size:16px;white-space:nowrap}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand)}
.chip.on::before{content:"✓ "}
.chip.all.on::before{content:""}
.chips{flex-wrap:wrap;overflow:visible!important;padding-left:4px!important;row-gap:10px}
.selinfo{font-size:15px;margin:-4px 0 8px;color:var(--brand);font-weight:600}
.tag{display:inline-block;font-size:14px;border-radius:6px;padding:2px 8px;background:var(--chip);color:var(--ink);margin-right:4px}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:16px;font-weight:600;margin:12px 0 4px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--chip);cursor:pointer}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.small{padding:6px 10px;font-size:16px}
.btn.sm{padding:6px 10px;font-size:15px;margin:6px 6px 0 0}
.animcap{font-weight:600;font-size:16px;min-height:20px;margin-top:6px}
.animbar{display:flex;flex-wrap:wrap}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#1b1b1b;font-size:30px;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:6}
.star{border:0;background:none;font-size:24px;line-height:1;padding:2px 4px;color:var(--muted)}
.star.on{color:var(--accent)}
.drill-title{font-weight:700;font-size:19px;margin:0}
.section h3{font-size:16px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 4px}
.section p{margin:0 0 4px;white-space:pre-wrap}
.section ul{margin:2px 0 6px;padding-left:20px}
.section li{margin:3px 0;line-height:1.35}
.section p.goal{font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;padding:32px 8px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:16px;z-index:20;max-width:90vw}
.plan-item{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.plan-item:first-child{border-top:0}
.plan-item input{width:64px;padding:6px 8px}
.num{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:32px;height:32px;flex:none}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:86vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card)}
dialog .dbody{padding:8px 16px 16px;overflow:auto}
.pick{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.center{max-width:380px;margin:40px auto}
.back{border:0;background:none;color:var(--brand);font-weight:600;padding:0 0 10px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:16px}
.sumgrid span{margin-right:6px}
.tl{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl-time{flex:none;width:58px;display:flex;flex-direction:column;align-items:flex-start;border-right:3px solid var(--brand);padding-right:6px}
.tl-time b{font-size:17px;color:var(--brand)}
.tl-time span{font-size:14px;color:var(--muted)}
.tl-body{flex:1;min-width:0}
.tl-meta{font-size:15px;color:var(--muted);margin-top:2px}
.tl-meta .warn{color:#b35c00;font-weight:600}
.tl-note{font-size:16px;background:var(--chip);border-radius:8px;padding:4px 8px;margin-top:6px;white-space:pre-wrap}
.tl-desc{margin:6px 0 0;font-size:16px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-desc.open{display:block;-webkit-line-clamp:unset}
.tl-more{margin-top:4px;font-size:16px}
.tl-more summary{color:var(--brand);font-weight:600;cursor:pointer;font-size:14px}
.tl-more p{margin:4px 0;white-space:pre-wrap}
.tl-end{padding:8px 0}
.vid{flex:none;background:#c4302b;color:#fff;text-decoration:none;font-size:15px;font-weight:700;border-radius:8px;padding:5px 9px;white-space:nowrap}
.print-only{display:none}
@media print{.print-only{display:block;font-size:14px;color:#555;word-break:break-all} .tl-desc{display:block;-webkit-line-clamp:unset} .tl-more summary{display:none}}
.ddrow{display:flex;gap:8px;margin:10px 0 8px}
.dd{position:relative;flex:1;min-width:0}
.ddbtn{width:100%;display:flex;align-items:center;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:16px;white-space:nowrap;cursor:pointer}
.ddbtn .ddl{color:var(--muted)}
.ddbtn b{overflow:hidden;text-overflow:ellipsis}
.ddbtn .caret{margin-left:auto;padding-left:4px;color:var(--muted)}
.ddbtn.on{border:2px solid var(--brand);background:var(--sel);padding:8px 9px}
.ddbtn.on b{color:var(--brand)}
.ddmenu{display:none;position:absolute;z-index:40;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:min(320px,90vw);max-height:62vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:6px}
.dd:last-child .ddmenu{left:auto;right:0}
.dd.open .ddmenu{display:block}
.dd.open .ddbtn .caret{transform:rotate(180deg)}
.ddopt{display:flex;gap:10px;align-items:center;font-weight:400;margin:0;padding:9px 8px;border-radius:8px;font-size:17px;cursor:pointer}
.ddopt.on{background:var(--sel);font-weight:700;color:var(--brand)}
.ddopt input{width:18px;height:18px;accent-color:var(--brand);margin:0;flex:none}
.ddopt .n{margin-left:auto;color:var(--muted);font-weight:400;font-size:15px}
.ddok{width:100%;margin-top:6px}
.thumb{flex:none;width:112px;border-radius:8px;overflow:hidden;align-self:flex-start;background:#3a9a52;aspect-ratio:3/2}
.agebar{font-size:16px;margin:-4px 0 10px;color:var(--muted)}
.agebar b{color:var(--brand)}
.linkbtn{border:0;background:none;color:var(--brand);text-decoration:underline;padding:0 4px;font-size:16px}
.agepick{display:flex;flex-wrap:wrap;gap:6px}
.agepick .chip{font-size:18px;padding:8px 16px}
label.chk{display:inline-flex;gap:4px;align-items:center;font-weight:500;margin:0 10px 0 0}
.plan{min-height:60px}
.pi,.po{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);background:var(--card)}
.pi:first-child,.po:first-child{border-top:0}
.handle{flex:none;touch-action:none;cursor:grab;font-size:24px;line-height:1;color:var(--muted);padding:6px 4px;user-select:none}
.pt{flex:none;width:44px;font-weight:700;color:var(--brand);font-size:16px}
.pn{font-weight:600;font-size:17px;line-height:1.25}
.pw{font-size:14px;color:#b35c00;font-weight:600}
.pnote{margin-top:4px;width:100%;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:15px;background:var(--card)}
.dur{flex:none;display:flex;align-items:center;gap:2px}
.dur button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--chip);font-size:20px;line-height:1}
.dur b{min-width:22px;text-align:center}
.dur small{color:var(--muted);margin-right:2px}
.x{flex:none;border:0;background:none;color:var(--muted);font-size:18px;padding:4px}
.add{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:24px;line-height:1}
.dropempty{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.ph{height:46px;border:2px dashed var(--brand);border-radius:10px;margin:4px 0;background:rgba(31,122,63,.06)}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:10px;padding:6px 8px;background:var(--card)}
.dragging{opacity:.3}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;margin:0 -16px -96px;font-size:16px;font-weight:600;z-index:5}
input[type=time]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.sdate{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--chip);padding:6px 0;line-height:1.1}
.sdate b{display:block;font-size:22px;color:var(--brand)}
.sdate span{font-size:14px;text-transform:uppercase;color:var(--muted)}
.past{opacity:.6}
@media print{header,nav.tabs,.fab,.noprint{display:none!important} body{background:#fff;color:#000} .card{box-shadow:none;border-color:#bbb;break-inside:avoid}}

.plusbtn{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:34px;font-weight:700;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;align-self:center}
.bigadd{width:100%;margin:10px 0 4px;padding:14px;font-size:19px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:22px}
.sopt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin-top:10px;cursor:pointer}
.sopt.rec{border:2px solid var(--brand);background:var(--sel)}
.sopt .sdate{min-width:48px}
.badge{display:inline-block;font-size:14px;font-weight:700;border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.badge.draft{background:#fff1cc;color:#8a5a00}
.badge.ready{background:var(--sel);color:var(--brand)}
.badge.rec{background:var(--brand);color:var(--brand-ink)}
.tpl{margin:8px 0 4px}
.tplbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-bottom:6px}
.tplrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;cursor:pointer;color:var(--ink)}
.tplrow .dot{width:14px;height:14px;border-radius:4px;flex:none}
.tplv{font-weight:700;white-space:nowrap;border-radius:6px;padding:2px 8px}
.tplv.ok{background:var(--sel);color:var(--brand)}
.tplv.under{background:#fff1cc;color:#8a5a00}
.tplv.over{background:#fde2e2;color:#b42318}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
.seg label{flex:1;margin:0;font-weight:600;text-align:center;padding:10px 6px;cursor:pointer;background:var(--card)}
.seg input{display:none}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink)}

.pi{flex-wrap:wrap;row-gap:4px}
.pi > .grow{flex:1 1 calc(100% - 110px)}
.pi .dur{margin-left:auto}
.pnote{width:100%}
.thumb{width:96px}
.fab{right:auto;left:18px}

.tl-thumb{width:84px;cursor:zoom-in;margin-right:2px}
.tl-big{margin:8px 0}
.sumline{margin-top:4px;font-size:16px;color:var(--muted)}
.sumline b{color:var(--brand)}
.tl2{padding:12px 0;border-top:1px solid var(--line)}
.tl2:first-child{border-top:0}
.tl2-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tl2-head .drill-title{margin:0;font-size:18px;min-width:0}
.tl2-no{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.tl2-time{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.tl2-time b{font-size:16px;color:var(--brand)}
.tl2-time span{font-size:14px;color:var(--muted)}
.tl2-anim{border-radius:12px;overflow:hidden;background:#3a9a52;aspect-ratio:3/2;cursor:pointer}
.vidlink{color:var(--brand);font-weight:700;text-decoration:none}
.tl-endline{padding:10px 0;border-top:1px solid var(--line);font-weight:700;font-size:16px}
.totd{margin-top:8px}
.mv{flex:none;display:flex;flex-direction:column;gap:4px}
.mv button{width:40px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--brand);font-size:16px;line-height:1;cursor:pointer;padding:0}
.mv button:active{background:var(--sel)}.mv button:disabled{opacity:.3;cursor:default}
@keyframes movedfl{from{background:var(--sel)}to{background:var(--card)}}.pi.moved{animation:movedfl .8s}
.steps{margin:4px 0 10px;padding-left:22px;font-size:15px;line-height:1.45}.steps li{margin:4px 0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,122,63,.5)}50%{box-shadow:0 0 0 8px rgba(31,122,63,0)}}.pulse{animation:pulse 1.2s 3}
.tipbox{margin-top:10px;background:var(--sel);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.4}
.tipbox ul{margin:6px 0 0;padding-left:20px}.tipbox li{margin:3px 0}
#notices{max-width:760px;margin:0 auto;padding:0 16px}
.notice{margin-top:10px;background:var(--card);border:2px solid var(--brand);border-radius:12px;padding:10px 12px;font-size:16px}
.nrow{margin-bottom:6px}.nrow a{color:var(--brand);font-weight:700}
.nurl{word-break:break-all;color:var(--muted)}
.hidnote{margin:6px 0 0;padding:6px 10px;border-radius:8px;background:#fde2e2;color:#b42318;font-weight:600;font-size:15px}
.totd summary{list-style:none;cursor:pointer}
.totd summary::-webkit-details-marker{display:none}
.totbar{position:relative;display:flex;height:10px;border-radius:5px;background:var(--line);overflow:visible}
.totbar i{display:block;height:100%;border-right:1px solid var(--card)}
.totbar i:first-child{border-radius:5px 0 0 5px}
.totbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);margin-left:-1px}
.totline{display:flex;align-items:baseline;gap:8px;margin-top:6px;font-size:15px}
.totline b{font-size:18px;color:var(--ink)}
.totline .tplv{font-size:14px;padding:1px 6px}
.totmore{color:var(--brand);font-weight:600;font-size:14px;white-space:nowrap}
.totd[open] .totmore{visibility:hidden}
@media print{.tl2-anim,.tl-big{display:none}}
.totbox{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.totmain{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.totmain b{font-size:28px;color:var(--brand)}
.totblk{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:15px;color:var(--muted)}
.totblk i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.totblk b{color:var(--ink)}

.pthumb{width:64px}
.pi > .grow{flex:1 1 calc(100% - 180px)}
@media (max-width:600px){.pi .handle{display:none}.pi > .grow{flex:1 1 calc(100% - 200px)}.pi .pt{width:auto;font-size:15px}}

.totmain .tplv{white-space:normal}
</style>
</head>
<body>
<header>
  <h1 id="title"><span class="brand">⚽ KoKo</span><span class="sub">kouč kopané</span></h1>
  <button id="logoutBtn" hidden>Odhlásit</button>
</header>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="drills" class="on">Cvičení</button>
  <button data-tab="sessions">Tréninky</button>
  <button data-tab="add" class="tab2">＋ Přidat<br>cvičení</button>
  <button data-tab="settings" style="flex:0 0 auto;padding:12px 16px" aria-label="Nastavení">⚙</button>
</nav>
<div id="notices"></div>
<main id="app"><p class="muted">Načítám…</p></main>
<button class="fab" id="fab" hidden aria-label="Přidat">+</button>
<dialog id="pickDlg"><div class="dhead"><strong class="grow">Přidat cvičení do tréninku</strong><button class="btn small" id="pickClose">Hotovo</button></div><div class="dbody"><input type="search" id="pickSearch" placeholder="Hledat…"><div id="pickList"></div></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>/*ANIM*/
/* ===== Animace cvičení: jednoduchý SVG engine + scény ===== */
const Anim = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const COL = { blue: "#2563eb", red: "#dc2626", ice: "#38bdf8", yellow: "#eab308", coach: "#111827", sick: "#65a30d", orange: "#f97316" };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const lerp = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
  const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

  function stage(svg, vb) {
    const [W, H] = vb;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = "";

  function common(S, sp) {

const LANG = { cs:"🇨🇿 CZ", sk:"🇸🇰 SK", en:"🇬🇧 EN", de:"🇩🇪 DE" };
const isMine = d => state.user && d.user_id === state.user.id;
const parseT = v => { v = String(v??"").trim().toLowerCase(); if(!v) return null;
  let m = /^(?:(\d+):)?(\d{1,2}):(\d{2})$/.exec(v); if(m) return (+(m[1]||0))*3600 + (+m[2])*60 + (+m[3]);
  m = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/.exec(v); if(m && (m[1]||m[2]||m[3])) return (+(m[1]||0))*3600 + (+(m[2]||0))*60 + (+(m[3]||0));
  return NaN; };
const fmtT = n => n==null ? "" : `${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
const urlStart = u => { try{ const x = new URL(u); const t = x.searchParams.get("t") || x.searchParams.get("start"); return t ? parseT(t) : null; }catch(e){ return null; } };
const segLabel = d => d.video_start!=null || d.video_end!=null ? `úsek ${fmtT(d.video_start||0)}–${d.video_end!=null?fmtT(d.video_end):"konec"}` : "";
const vidHref = d => { const u = safeUrl(d.video_url); const id = ytId(u); return id && d.video_start ? `https://www.youtube.com/watch?v=${id}&t=${d.video_start}s` : u; };
const ytId = u => { const m = /(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/.exec(u||""); return m ? m[1] : null; };
const safeUrl = u => u && /^https?:\/\//i.test(u) ? u : null;
const hhmm = mins => `${String(Math.floor(mins/60)%24).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`;
const toMin = t => { if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; };

async function setMark(id, field, val, rerender = render){
  const d = state.drills.find(x=>x.id===id); if(!d) return; const old = d[field]; d[field] = val;
  if(field==="hidden" && val) d.favorite = false;
  rerender();
  const { error } = await sb.from("drill_marks").upsert({ user_id:state.user.id, drill_id:id, favorite:d.favorite, hidden:d.hidden, updated_at:new Date().toISOString() }, { onConflict:"user_id,drill_id" });
  if(error){ d[field] = old; rerender(); return fail(error); }
  if(field==="hidden") toast(val ? "Cvičení vyřazeno z nabídky (najdeš ho ve filtru 🚫 Vyřazené)" : "Cvičení vráceno do nabídky");

      <div class="row"><strong class="grow">Doporučená šablona (${TEMPLATE_TOTAL} min)</strong><button type="button" class="linkbtn" id="sortTpl">Seřadit podle šablony</button></div>
      <div id="tpl" class="tpl"></div>
      <p class="muted" style="margin:2px 0 12px">Klepnutím na část šablony se zásobník vyfiltruje na vhodné typy cvičení.</p>
      <div class="row"><strong class="grow">Rozvrh tréninku</strong><span class="muted" id="tot"></span></div>
      <p class="muted" style="margin:2px 0 8px">Přetáhni cvičení za úchyt ⠿ ze zásobníku sem, nebo klepni na +. Pořadí měníš šipkami ▲ ▼ (nebo přetažením za ⠿), délku tlačítky − / +.</p>
      <div id="plan" class="plan"></div>
    </div>
    <div class="card">
      <div class="row"><strong class="grow">Zásobník cvičení</strong></div>
      <input type="search" id="pq" placeholder="Hledat cvičení…" style="margin-top:8px">
      <div class="ddrow" id="pchips"></div>
      <div id="pool"></div>
    </div>
    <div class="savebar"><span id="tot2" class="grow"></span><button class="btn primary" type="submit">Uložit trénink</button></div>
  </form>`;
  const form = document.getElementById("sf"), plan = document.getElementById("plan"), pool = document.getElementById("pool");
  const findD = id => state.drills.find(x=>x.id===id);

  function drawTpl(){
    const act = {}; items.forEach(it => { const b = blockOf(findD(it.drill_id)); const k = b ? b.k : "jine"; act[k] = (act[k]||0) + (Number(it.duration_min)||0); });
    let t0 = 0;
    const st = toMin(form.start_time.value);
    document.getElementById("tpl").innerHTML = `<div class="tplbar">${TEMPLATE.map(b=>`<div style="flex:${b.min};background:${b.col}"></div>`).join("")}</div>` + TEMPLATE.map(b => {
      const a = act[b.k]||0, diff = a - b.min, from = t0; t0 += b.min;
      const cls = Math.abs(diff) <= 3 ? "ok" : diff < 0 ? "under" : "over";
      return `<button type="button" class="tplrow" data-blk="${b.k}"><span class="dot" style="background:${b.col}"></span><span class="grow"><b>${b.name}</b><br><span class="muted">${st!=null?`${hhmm(st+from)}–${hhmm(st+from+b.min)}`:`${from}.–${from+b.min}. min`}</span></span><span class="tplv ${cls}">${a} / ${b.min} min</span></button>`;
    }).join("") + (act.jine ? `<div class="muted" style="margin-top:4px">Ostatní: ${act.jine} min</div>` : "");
    document.querySelectorAll("[data-blk]").forEach(el => el.onclick = () => { const b = TEMPLATE.find(x=>x.k===el.dataset.blk); if(b.fotbal){ if(FD && !items.some(x=>x.drill_id===FD.id)){ items.push({ drill_id:FD.id, duration_min:20, note:"" }); drawPlan(); drawPool(); } return; } pickCats.clear(); b.cats.forEach(c=>pickCats.add(c)); drawPool(); document.getElementById("pq").scrollIntoView({ behavior:"smooth", block:"center" }); });
  }
  function totals(){
    drawTpl();
    const sum = items.reduce((a,x)=>a+(Number(x.duration_min)||0),0);
    const st = toMin(form.start_time.value);
    const txt = `${items.length} cvičení · ${sum} min${st!=null?` · ${hhmm(st)}–${hhmm(st+sum)}`:""}`;
    document.getElementById("tot").textContent = txt;
    document.getElementById("tot2").textContent = txt;
    let acc = 0;
    plan.querySelectorAll(".pi").forEach((row,i) => { const a=acc; acc += Number(items[i].duration_min)||0; row.querySelector(".pt").textContent = st!=null ? hhmm(st+a) : `${a}'`; });
    const c = Number(form.coaches.value)||0, kids = Number(form.players_expected.value)||0;
    plan.querySelectorAll(".pi").forEach((row,i) => {
      const d = findD(items[i].drill_id); const w = [];
      if(c && d?.coaches_needed > c) w.push(`potřeba ${d.coaches_needed} trenérů`);
      if(kids && ((d?.players_min && kids < d.players_min) || (d?.players_max && kids > d.players_max))) w.push(`pro ${d.players_min||"?"}–${d.players_max||"?"} dětí`);
      row.querySelector(".pw").textContent = w.length ? "⚠ " + w.join(", ") : "";
    });
  }
  function drawPlan(){
    plan.innerHTML = items.length ? items.map((it,i)=>{ const d=findD(it.drill_id);
      return `<div class="pi" data-i="${i}">
        <div class="mv"><button type="button" data-up="${i}" aria-label="Posunout výš" ${i===0?"disabled":""}>▲</button><button type="button" data-down="${i}" aria-label="Posunout níž" ${i===items.length-1?"disabled":""}>▼</button></div>
        <span class="handle" data-h="plan" aria-label="Přesunout">⠿</span>
        <span class="pt"></span>
        ${d && Anim.has(d.name)?`<div class="thumb pthumb" data-thumb="${esc(d.name)}"></div>`:""}
        <div class="grow" style="min-width:0">
          <div class="pn">${esc(d?.name||"?")}</div>
          <div class="muted" style="font-size:12px">${CATS[d?.category]||""}${d?.xps_video||d?.video_url?" · ▶":""}</div>
          <div class="pw"></div>
          <input class="pnote" data-note="${i}" placeholder="poznámka (kdo vede, stanoviště…)" value="${esc(it.note)}">
        </div>
        <div class="dur"><button type="button" data-dm="${i}">−</button><b>${it.duration_min}</b><small>min</small><button type="button" data-dp="${i}">+</button></div>
        <button type="button" class="x" data-rm="${i}" aria-label="Odebrat">✕</button>
      </div>`; }).join("")
      : `<div class="dropempty">Sem přetáhni cvičení ze zásobníku</div>`;
    plan.querySelectorAll("[data-dm]").forEach(b => b.onclick = () => { const it=items[b.dataset.dm]; it.duration_min=Math.max(1,(it.duration_min||0)-1); drawPlan(); });
    plan.querySelectorAll("[data-dp]").forEach(b => b.onclick = () => { const it=items[b.dataset.dp]; it.duration_min=Math.min(90,(it.duration_min||0)+1); drawPlan(); });
    const move = (i, j) => { if(j<0 || j>=items.length) return; [items[i], items[j]] = [items[j], items[i]]; drawPlan();
      const r = plan.querySelector(`.pi[data-i="${j}"]`); if(r){ r.classList.add("moved"); const btn = r.querySelector(j<i?"[data-up]":"[data-down]"); (btn && !btn.disabled ? btn : r.querySelector("[data-up],[data-down]"))?.focus({preventScroll:true}); r.scrollIntoView({block:"nearest", behavior:"smooth"}); } };
    plan.querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, +b.dataset.up - 1));
    plan.querySelectorAll("[data-down]").forEach(b => b.onclick = () => move(+b.dataset.down, +b.dataset.down + 1));
    plan.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { items.splice(+b.dataset.rm,1); drawPlan(); drawPool(); });
    plan.querySelectorAll("[data-note]").forEach(inp => inp.oninput = () => { items[inp.dataset.note].note = inp.value; });
    mountThumbs(plan);
    plan.querySelectorAll('[data-h="plan"]').forEach(h => h.onpointerdown = e => startDrag(e, { type:"plan", index:+h.closest(".pi").dataset.i }, h.closest(".pi")));
    totals();
  }
  function poolList(){
    const q = pickQ.toLowerCase();
    return state.drills.filter(d => !d.hidden && agesMatch(d, pickAges) && (!pickCats.size||pickCats.has(d.category)) && (!q || d.name.toLowerCase().includes(q)));
  }
  function drawPool(){
    const base = state.drills.filter(d => agesMatch(d, pickAges)), byType = state.drills.filter(d => !pickCats.size || pickCats.has(d.category));
    const pc = document.getElementById("pchips");
    pc.innerHTML = ddHtml("page", "Kat.", AGES.map(a=>[a, a, byType.filter(d=>(d.age_groups||[]).includes(a)).length]), pickAges) +
      ddHtml("pcat", "Typ", Object.entries(CATS).filter(([k])=>state.drills.some(d=>d.category===k)).map(([k,v])=>[k, v, base.filter(d=>d.category===k).length]), pickCats);
    ddBind(pc, "page", pickAges, drawPool); ddBind(pc, "pcat", pickCats, drawPool);
    const used = new Set(items.map(x=>x.drill_id));
    const list = poolList();
    pool.innerHTML = list.map(d=>`<div class="po" data-id="${d.id}">
        <span class="handle" data-h="pool" aria-label="Přetáhnout do tréninku">⠿</span>
        <div class="grow" style="min-width:0"><div class="pn">${esc(d.name)}${used.has(d.id)?' <span class="muted">✓</span>':""}</div>
          <div class="muted" style="font-size:12px">${CATS[d.category]} · ${d.duration_min||10} min${d.coaches_needed>1?` · 🧑‍🏫 ${d.coaches_needed}`:""}${d.xps_video||d.video_url?" · ▶":""}</div></div>
        <button type="button" class="add" data-add="${d.id}" aria-label="Přidat na konec">+</button>
      </div>`).join("") || `<p class="muted">Nic nenalezeno.</p>`;
    pool.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { addDrill(b.dataset.add, endPos()); });
    pool.querySelectorAll('[data-h="pool"]').forEach(h => h.onpointerdown = e => startDrag(e, { type:"pool", id:h.closest(".po").dataset.id }, h.closest(".po")));
  }
  function addDrill(id, at){ const d=findD(id); items.splice(at,0,{ drill_id:id, duration_min:d?.duration_min||10, note:"" }); drawPlan(); drawPool(); toast("Přidáno: "+(d?.name||"")); }

  // ---- drag & drop (myš i dotyk) ----
  let drag = null;
  function startDrag(e, payload, srcEl){
    e.preventDefault();
    const r = srcEl.getBoundingClientRect();
    const ghost = srcEl.cloneNode(true);
    ghost.classList.add("ghost"); ghost.style.width = r.width+"px"; ghost.style.left = r.left+"px"; ghost.style.top = r.top+"px";
    document.body.appendChild(ghost);
    const ph = document.createElement("div"); ph.className = "ph";
    if(payload.type==="plan") srcEl.classList.add("dragging");
    drag = { payload, ghost, ph, srcEl, dx:e.clientX-r.left, dy:e.clientY-r.top, index:null };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp, { once:true });
    document.addEventListener("pointercancel", onUp, { once:true });
    onMove(e);
  }
  function onMove(e){
    if(!drag) return;
    drag.ghost.style.left = (e.clientX-drag.dx)+"px"; drag.ghost.style.top = (e.clientY-drag.dy)+"px";
    // automatické posouvání stránky u okrajů
    if(e.clientY < 70) scrollBy(0,-12); else if(e.clientY > innerHeight-90) scrollBy(0,12);
    const pr = plan.getBoundingClientRect();
    const inside = e.clientY > pr.top-40 && e.clientY < pr.bottom+40 && e.clientX > pr.left-20 && e.clientX < pr.right+20;
    if(!inside){ drag.ph.remove(); drag.index = null; return; }
    const rows = [...plan.querySelectorAll(".pi")].filter(x=>x!==drag.srcEl);
    let idx = rows.length;
    for(let i=0;i<rows.length;i++){ const rr=rows[i].getBoundingClientRect(); if(e.clientY < rr.top+rr.height/2){ idx=i; break; } }
    drag.index = idx;
    const empty = plan.querySelector(".dropempty"); if(empty) empty.remove();
    if(idx < rows.length) plan.insertBefore(drag.ph, rows[idx]); else plan.appendChild(drag.ph);
  }
  function onUp(){
    document.removeEventListener("pointermove", onMove);
    if(!drag) return;
    const { payload, index } = drag;
    drag.ghost.remove(); drag.ph.remove(); drag.srcEl.classList.remove("dragging");
    drag = null;
    if(index==null){ drawPlan(); return; }
    if(payload.type==="plan"){ const [it] = items.splice(payload.index,1); items.splice(index,0,it); drawPlan(); }
    else addDrill(payload.id, index);
  }

  document.getElementById("pq").oninput = e => { pickQ = e.target.value; drawPool(); };
  form.start_time.oninput = totals; form.coaches.oninput = totals; form.players_expected.oninput = totals;
  drawPlan(); drawPool();
  document.getElementById("sortTpl").onclick = () => { const ord = it => { const b = blockOf(findD(it.drill_id)); return b ? TEMPLATE.indexOf(b) : 3.5; }; items.sort((a,b)=>ord(a)-ord(b)); drawPlan(); drawPool(); toast("Seřazeno podle šablony"); };
  document.getElementById("back").onclick = () => s.id ? showSession(s.id) : (state.view=null, render());
  form.onsubmit = async e => {
    e.preventDefault();
    if(!items.length && !confirm("Trénink zatím nemá žádné cvičení. Uložit i tak?")) return;
    const fd = Object.fromEntries(new FormData(form));
    for(const k of ["coaches","players_expected"]) fd[k] = fd[k] ? Number(fd[k]) : null;
    for(const k in fd) if(fd[k]==="") fd[k]=null;
    const btn = e.submitter; btn.disabled = true;
    try{
      let id = s.id;
      if(id){ const { error } = await sb.from("sessions").update(fd).eq("id", id); if(error) throw error;
        const { error: e2 } = await sb.from("session_drills").delete().eq("session_id", id); if(e2) throw e2; }
      else { const { data, error } = await sb.from("sessions").insert(fd).select().single(); if(error) throw error; id = data.id; }
      if(items.length){ const { error } = await sb.from("session_drills").insert(items.map((x,i)=>({ session_id:id, drill_id:x.drill_id, duration_min:x.duration_min||null, note:x.note||null, position:i }))); if(error) throw error; }
      await loadSessions(); toast("Trénink uložen"); showSession(id);
    }catch(err){ fail(err); btn.disabled = false; }
  };
  scrollTo(0,0);
}

function inviteLink(email){ return location.origin + location.pathname + "?invite=" + encodeURIComponent(email); }
const inviteText = email => `Ahoj,\n\nzvu tě do aplikace KoKo – kouč kopané: databáze cvičení a plánovač tréninků pro přípravky.\n\nZaregistruj se tímto e-mailem (${email}) zde:\n${inviteLink(email)}\n\nPo registraci ti přijde potvrzovací e-mail.\n\n${state.user.email}`;
async function inviteShare(email){
  const text = inviteText(email);
  if(navigator.share){ try{ await navigator.share({ title:"Pozvánka do aplikace KoKo", text }); return; }catch(e){ if(e && e.name==="AbortError") return; } }
  try{ await navigator.clipboard.writeText(text); toast("Text pozvánky zkopírován – vlož ho do WhatsAppu nebo SMS"); }
  catch(e){ prompt("Zkopíruj text pozvánky:", text); }
}
function inviteMail(email){
  const body = inviteText(email);
  location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent("Pozvánka do aplikace KoKo – kouč kopané")}&body=${encodeURIComponent(body)}`;
}
async function loadInvites(){

const ADD_TAB_FOR_ALL = false;
function render(){
  if(!state.user) return renderAuth(inviteEmail() ? "signup" : "login");
  document.getElementById("tabs").hidden = false; document.getElementById("logoutBtn").hidden = false;
  setTitle();
  if(state.profile && !state.ages) state.ages = new Set(myAges());
  if(!myAges().length){ document.getElementById("tabs").hidden = true; return renderSettings(true); }
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab===state.tab));
  if(state.view?.type==="drill") return showDrill(state.view.id);
  if(state.view?.type==="session") return showSession(state.view.id);
  if(state.tab==="settings") return renderSettings();
  /* Záložka „Přidat cvičení“ je dočasně skrytá – vidí ji jen správce. Pro zpřístupnění všem nastav ADD_TAB_FOR_ALL = true. */
  const addTab = document.querySelector('#tabs [data-tab="add"]'); if(addTab) addTab.hidden = !(ADD_TAB_FOR_ALL || state.isAdmin);
  if(state.tab==="add" && !(ADD_TAB_FOR_ALL || state.isAdmin)) state.tab = "drills";
  if(state.tab==="add"){ renderAdd(); Promise.all([loadSubmissions(), loadDrills()]).then(()=>{ if(state.tab==="add" && !state.view) renderAdd(); }).catch(fail); return; }
  fab.hidden = false;
  state.tab==="drills" ? renderDrills() : renderSessions();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.view = null; render(); });
fab.onclick = () => state.tab==="drills" ? editDrill() : editSession();

let loadedFor = null;
sb.auth.onAuthStateChange((_ev, session) => {
  const u = session?.user || null;
  state.user = u;
  if(!u){ loadedFor = null; state.drills=[]; state.sessions=[]; state.profile=null; state.ages=null; state.view=null; return render(); }
  if(loadedFor === u.id) return;
  loadedFor = u.id;
  setTimeout(async () => {
    try{ await Promise.all([loadDrills(), loadSessions(), loadProfile(), sb.rpc("is_admin").then(r => { state.isAdmin = !!r.data; })]); }catch(e){ fail(e); }
    loadNotices();
    render();
  }, 0);
});
</script>
</body>
</html>
